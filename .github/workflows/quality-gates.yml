name: quality-gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test, architecture rules and package
        run: mvn -B -f services/payment-service/pom.xml clean verify
      - name: Generate dependency report
        run: mvn -B -f services/payment-service/pom.xml dependency:tree -DoutputFile=target/dependency-tree.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
  container:
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable image candidate
        run: docker build -t ubuntu-bank/payment-service:${{ github.sha }} services/payment-service
      - name: Export software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: ubuntu-bank/payment-service:${{ github.sha }}
          artifact-name: payment-service-sbom.spdx.json
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ubuntu-bank/payment-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

